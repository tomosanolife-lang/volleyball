<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大会結果 閲覧</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1e3a5f;--blue:#2980b9;--green:#27ae60;--gold:#f0c040;--red:#e74c3c;--bg:#eef4fb;--border:#c8dff5}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:#2d3748;font-size:13px;min-height:100vh}

.hdr{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:14px 12px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.hdr h1{font-size:15px;font-weight:900}
.hdr p{font-size:10px;opacity:.75;margin-top:3px}
.reload-btn{margin-top:8px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:white;padding:5px 16px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}

.tabs{display:flex;background:white;border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:64px;z-index:99;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:72px;padding:10px 6px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:none;border-bottom:3px solid transparent;color:#888;background:none;font-family:inherit;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);background:#f0f7ff}

.pg{display:none;padding:14px;max-width:720px;margin:0 auto}
.pg.on{display:block}

.card{background:white;border-radius:14px;padding:14px;margin-bottom:14px;border:1.5px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-title{font-size:.88rem;font-weight:900;color:var(--navy);margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:6px}

/* 試合結果 */
.mtbl{width:100%;border-collapse:collapse;font-size:11px}
.mtbl th{background:#2c3e50;color:white;padding:6px 4px;text-align:center;font-size:10px}
.mtbl td{border:1px solid #e8eef5;padding:5px 4px;text-align:center;vertical-align:middle}
.mtbl tr:nth-child(even) td{background:#f8fbff}
.tc{text-align:left!important;padding-left:8px!important;font-weight:700}
.mn{background:#f5f7fa;font-size:10px;font-weight:700;color:#666;white-space:nowrap;padding:3px 6px}
.score-cell{font-size:13px;font-weight:900}
.win{color:#27ae60}.lose{color:#e74c3c}.draw{color:#888}

/* 順位表 */
.rtbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.rtbl th{background:#2c3e50;color:white;padding:5px 3px;font-size:10px;text-align:center}
.rtbl td{border:1px solid #e8eef5;padding:5px 3px;text-align:center}
.rtbl .rn{text-align:left!important;padding-left:7px!important;font-weight:700}
.rank1{background:#fff9e6;color:#b8860b;font-weight:900}
.rank2{background:#eaf3fb;color:#1a5276;font-weight:900}
.rank3{background:#eafaf1;color:#1e8449;font-weight:900}

/* 決勝 */
.flbl{font-size:12px;font-weight:900;color:#7d5a00;background:#fffde7;border-left:4px solid var(--gold);padding:7px 12px;margin-bottom:10px;border-radius:0 8px 8px 0}
.fmatch{background:#fffef5;border:1.5px solid #f8d860;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ftitle{font-size:10px;font-weight:900;color:#7d5a00;margin-bottom:6px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fteam{flex:1;min-width:90px;padding:8px;border-radius:8px;font-weight:900;font-size:12px;text-align:center;border:1.5px solid var(--gold);background:#fff9e0}
.fscr{font-size:14px;font-weight:900;min-width:30px;text-align:center}
.winner-badge{width:100%;text-align:center;font-size:11px;margin-top:6px;padding:4px;background:#fff3cd;border-radius:6px}

/* バッジ */
.tbadge{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700}
.info{font-size:11px;color:#555;background:#eaf3fb;border-radius:10px;padding:9px 12px;border-left:3px solid var(--blue);margin-bottom:10px}

/* ローディング */
.loading{text-align:center;padding:40px;color:#aaa}
.spinner{width:36px;height:36px;border:3px solid #e0e9f5;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.prog{background:#eaf3fb;border-radius:8px;padding:6px 12px;margin-bottom:8px}
.pbar{height:6px;background:#c8d8e8;border-radius:3px;overflow:hidden;margin-top:4px}
.pfill{height:100%;background:linear-gradient(90deg,var(--green),#2ecc71);border-radius:3px}
</style>
</head>
<body>

<div class="hdr">
  <h1 id="v-title">🏐 大会結果 閲覧</h1>
  <p id="v-sub">読み込み中...</p>
  <button class="reload-btn" id="reload-btn">🔄 最新情報に更新</button>
</div>
<div class="tabs" id="v-tabs"></div>
<div id="v-pages"></div>

<script>
'use strict';
// ===== 設定 =====
// ※ここのBIN_IDを管理システムで同期後に表示されるBIN IDに書き換えてください
const GAS_URL='https://script.google.com/macros/s/AKfycbwhLp7mQZck-dnjYOEUgEHTpUhNmz7v70Q-77yob6RuETkEiGdv0QpDh-DgUA6gt9F9/exec';

const SHIBU=['第１','第２','第３','第４','第５','第６','一般','その他'];
const SBG={第１:'#FFF3CD',第２:'#D4EDDA',第３:'#D1ECF1',第４:'#F8D7DA',第５:'#E2D9F3',第６:'#FAD7A0',一般:'#F0F0F0',その他:'#EAECEE'};
const SFG={第１:'#7d6608',第２:'#155724',第３:'#0c5460',第４:'#721c24',第５:'#4a235a',第６:'#784212',一般:'#555',その他:'#444'};
const LT='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const M3=[[0,1,'①vs②'],[0,2,'①vs③'],[1,2,'②vs③']];
const M3x2=[...M3,[0,1,'①vs②(2)'],[0,2,'①vs③(2)'],[1,2,'②vs③(2)']];
const M4=[[0,1,'①vs②'],[2,3,'③vs④'],[0,2,'①vs③'],[1,3,'②vs④'],[0,3,'①vs④'],[1,2,'②vs③']];

let DB=null;
let currentTab='';

// BIN IDが未設定の場合は入力フォームを表示
function showBinInput(){
  document.getElementById('v-tabs').innerHTML='';
  document.getElementById('v-pages').innerHTML=`
    <div style="max-width:480px;margin:30px auto;padding:14px">
      <div class="card">
        <div class="card-title">📡 大会データに接続</div>
        <div class="info">管理システムの「☁️ クラウド同期」後に表示されるBIN IDを入力してください。</div>
        <div style="margin-bottom:10px">
          <input id="bin-input" type="text" placeholder="例: 6849abc123def..." 
            style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none">
        </div>
        <button onclick="connectBin()" style="width:100%;padding:10px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">接続する</button>
      </div>
    </div>`;
}

function connectBin(){
  const v=document.getElementById('bin-input').value.trim();
  if(!v){alert('BIN IDを入力してください');return;}
  BIN_ID=v;
  localStorage.setItem('viewer_bin_id',BIN_ID);
  loadData();
}

async function loadData(){
  document.getElementById('v-pages').innerHTML='<div class="loading"><div class="spinner"></div>データを読み込み中...</div>';
  try{
    const res=await fetch(GAS_URL);
    if(!res.ok){throw new Error('HTTP '+res.status);}
    DB=await res.json();
    renderAll();
  } catch(e){
    document.getElementById('v-pages').innerHTML=`<div class="loading"><div style="font-size:32px;margin-bottom:12px">❌</div><div style="font-weight:700;margin-bottom:10px">読み込み失敗</div><div style="font-size:11px;color:#aaa">${e.message}</div></div>`;
  }
}

loadData();

// 60秒ごとに自動更新
setInterval(()=>{if(BIN_ID&&DB)loadData();},60000);
</script>
</body>
</html>
